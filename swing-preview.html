<!doctype html><html lang="en"><meta charset="utf-8"><title>Swing clash motion study</title>
<style>body{margin:0;background:#090e1a;color:#e8efff;font:16px system-ui}header{position:absolute;top:24px;left:28px;z-index:2}h1{font-size:22px;margin:0 0 8px}p{color:#a5b6d2}button{background:#263652;color:white;border:1px solid #6a82ac;border-radius:8px;padding:10px 18px;cursor:pointer}canvas{display:block}footer{position:absolute;bottom:25px;left:28px;color:#a5b6d2}</style>
<header><h1>Swing · Drive clash</h1><p>Two fixed poses. Own amps charge each instrument.</p><button id="replay">Replay 12 vs 8</button> <button id="pose">Hold strike pose</button></header>
<footer id="status">Raise → dice → charge → clash → knockback</footer>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {createSwingClashVisuals,createClashFigure,knockbackWobble} from './src/board/swingClashVisuals.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#090e1a');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.append(renderer.domElement);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,100);camera.position.set(10,12,17);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.7,1);controls.update();
scene.add(new THREE.HemisphereLight('#e0efff','#343655',3));const light=new THREE.DirectionalLight('#ffffff',4);light.position.set(4,9,5);scene.add(light);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(28,24),new THREE.MeshStandardMaterial({color:'#152033',roughness:.7}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const grid=new THREE.GridHelper(24,12,'#466485','#23354f');grid.position.y=.01;scene.add(grid);
const points=[new THREE.Vector3(-2,.2,0),new THREE.Vector3(2,.2,0)];
const origins=[new THREE.Vector3(-8,1,-4),new THREE.Vector3(8,1,-4)];
origins.forEach((p,i)=>{const amp=new THREE.Mesh(new THREE.BoxGeometry(1.3,2,1),new THREE.MeshStandardMaterial({color:i?'#44aaff':'#ff6644',emissive:i?'#113377':'#662211'}));amp.position.copy(p);scene.add(amp);});
const battle={diceVals:[6,6],defenderDiceVals:[4,4],dicePool:[6,6],defenderDicePool:[6,6],atkTotal:12,defTotal:8,damage:4,attackerWon:true};
const clash=createSwingClashVisuals({battle,attacker:{num:0,color:'#ff6644'},defender:{num:1,color:'#44aaff'},pointFor:n=>points[n].clone(),ampOrigins:origins});scene.add(clash.group);
const after=[createClashFigure('#ff6644'),createClashFigure('#44aaff')];after.forEach((f,i)=>{f.position.copy(points[i]);f.visible=false;scene.add(f);});
let start=performance.now(),held=false;
document.querySelector('#replay').onclick=()=>{held=false;start=performance.now();};
document.querySelector('#pose').onclick=()=>{held=!held;};
renderer.setAnimationLoop(()=>{const t=held?10.5:(performance.now()-start)/1000;clash.group.visible=t<11.6;clash.update(t);
  after.forEach((f,i)=>{f.visible=t>=11.6;f.position.copy(points[i]);if(i){const p=Math.min(1,Math.max(0,t-11.6)*3);f.position.x+=p*2;f.rotation.z=Math.sin(t*23)*knockbackWobble(2,10)*Math.max(0,1-(t-11.6)/2);}});
  document.querySelector('#status').textContent=t<6.25?'Figure 1 · Both Drive pools roll':t<8.25?'Own Drive amps charge the instruments':t<11.6?'Figure 2 · 12 clashes against 8':'Rival takes 4 Vibe damage · one space back · low-Vibe wobble';
  renderer.render(scene,camera);});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></html>
