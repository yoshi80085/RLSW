<style>
:root{--bg:#030611;--panel:#0b1224;--line:#22304f;--ink:#dfe8ff;--dim:#8a9bc2;--accent:#ff66e6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 system-ui,Segoe UI,sans-serif}
#app{display:grid;grid-template-columns:1fr 340px;height:100vh}
#stage{position:relative;min-width:0;overflow:hidden}
#stage canvas{display:block;width:100%;height:100%}
#hud{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 20px)}
#tags{position:absolute;inset:0;pointer-events:none}
#tags .tag{position:absolute;transform:translate(-50%,-100%);background:#0b1224e0;border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:11px;color:var(--ink);white-space:nowrap}
aside{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:12px 14px 40px}
h1{font-size:15px;margin:0 0 4px} h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:14px 0 6px;border-top:1px solid var(--line);padding-top:10px}
.note{color:var(--dim);font-size:12px;margin:4px 0}
.btns{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
button,select{background:#14203c;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 8px;cursor:pointer;font:inherit}
button.on{border-color:var(--accent);color:var(--accent)} button:hover{border-color:#4a6aa8}
label.row{display:grid;grid-template-columns:128px 1fr 44px;gap:8px;align-items:center;margin:5px 0}
label.row span.v{text-align:right;color:var(--accent);font-variant-numeric:tabular-nums}
.sw{display:grid;grid-template-columns:60px 1fr;gap:6px;align-items:center;margin:4px 0}
input[type=range]{width:100%}
textarea{width:100%;height:170px;background:#050a16;color:#cfe;border:1px solid var(--line);border-radius:6px;font:11px/1.35 ui-monospace,Consolas,monospace;padding:6px}
.cmp{display:grid;grid-template-columns:70px 1fr;gap:6px;align-items:center;margin:4px 0}
.warn{color:#ff9a9a}
@media (max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:55vh 1fr;height:auto;min-height:100vh}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
<div id="app">
  <div id="stage"><div id="tags"></div><div id="hud"></div></div>
  <aside>
    <h1>\u{1F3AA} Marquee look</h1>
    <div class="note">The real marquee marker from the game, on a stand-in board with standee-sized cut-outs for scale. Pick a preset, or compare four side by side, then drag the levers. When it looks right press <b>\u{1F4CB} Copy dial-in</b> and paste it into the chat.</div>
    <div class="note" id="saveNote"></div>
    <h2>Mode</h2>
    <div class="btns" id="modeBtns"></div>
    <div id="singleBox">
      <h2>Preset</h2><div class="btns" id="presetBtns"></div>
      <h2>Style</h2><div id="switches"></div>
      <div id="sliders"></div>
    </div>
    <div id="compareBox">
      <h2>Compare \u2014 one look per quadrant</h2>
      <div id="compareRows"></div>
      <div class="note">Each quadrant's marquee wears the preset picked for it. Press <b>Edit this one</b> to take a look into single mode and tune it.</div>
    </div>
    <h2>View</h2>
    <div class="btns" id="viewBtns"></div>
    <div class="btns" id="qualBtns"></div>
    <div class="btns"><button id="takeBtn">\u{1F3AF} Take one (watch it leave and relight)</button><button id="reducedBtn">Reduced motion</button></div>
    <h2>Dial-in</h2>
    <div class="btns"><button id="copyBtn">\u{1F4CB} Copy dial-in</button><button id="resetBtn">\u21BA Reset</button></div>
