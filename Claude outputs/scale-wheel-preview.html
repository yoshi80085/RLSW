<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scale Wheel — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Saira:wght@400;600;700&display=swap" rel="stylesheet">
<!--
  🎡 PREVIEW — Alex, 2026-09-25: "an interactive scale wheel or scale visualizer -
  to be collapsible and viewable when deciding to build out what melody - Each
  character should get their own scale visualizer."
  Source: scale-wheel-preview.jsx · rebuild: npm run build:scalewheel
  Double-click this file; everything is bundled in.
-->
<style>
  :root { --bg:#060a13; --panel:#0b1120; --line:#1c2640; --txt:#c9d4ea; --dim:#6a7a98; }
  * { box-sizing:border-box; }
  body { margin:0; background:radial-gradient(1200px 700px at 30% 0%, #111a33 0%, var(--bg) 60%); color:var(--txt);
    font:13px/1.4 Saira, system-ui, sans-serif; min-height:100vh; }
  .page { max-width:1180px; margin:0 auto; padding:18px 16px 40px; }
  h1 { font-size:20px; margin:0 0 10px; letter-spacing:.5px; } h1 small { font:12px 'Share Tech Mono', monospace; color:var(--dim); margin-left:8px; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; }
  .tabs button { background:#0c1428; color:var(--txt); border:1px solid var(--line); border-radius:3px; padding:6px 12px; cursor:pointer;
    font:600 13px Saira, sans-serif; display:flex; flex-direction:column; align-items:flex-start; }
  .tabs button i { font:10px 'Share Tech Mono', monospace; color:var(--acc); font-style:normal; letter-spacing:1px; }
  .tabs button.on { border-color:var(--acc); box-shadow:0 0 0 1px var(--acc) inset, 0 0 14px -4px var(--acc); }
  .stage { display:grid; grid-template-columns:minmax(0,1fr) 290px; gap:16px; margin-top:14px; }
  @media (max-width:860px) { .stage { grid-template-columns:1fr; } }
  section.melody, aside.dial { background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:12px; }
  .plate { font:11px 'Share Tech Mono', monospace; letter-spacing:2px; color:#8daee5; margin:10px 0 6px; }
  .plate:first-child { margin-top:0; } .plate span { color:var(--dim); letter-spacing:0; margin-left:8px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0; }
  .stack { font:11px 'Share Tech Mono', monospace; color:var(--c); border:1px solid color-mix(in srgb, var(--c) 45%, transparent);
    padding:4px 8px; border-radius:3px; }
  .hand, .track { display:flex; flex-wrap:wrap; gap:2px; }
  .chip { background:none; border:0; padding:0; cursor:pointer; } .chip:disabled { cursor:default; }
  button, select { background:#0f1930; color:var(--txt); border:1px solid var(--line); border-radius:3px; padding:5px 10px; cursor:pointer; font:12px Saira, sans-serif; }
  button.go { border-color:#aa88ff88; } button:disabled { opacity:.4; cursor:default; }
  .dial .lv { display:block; margin:5px 0; font-size:12px; }
  .dial .lv button { padding:2px 7px; font-size:11px; margin-left:2px; } .dial .lv button.on { border-color:#ffd24a; color:#ffd24a; }
  .dial input[type=range] { width:120px; vertical-align:middle; }
  .readoff { font:10.5px 'Share Tech Mono', monospace; white-space:pre-wrap; word-break:break-word; background:#060b17; padding:8px; border-radius:3px; color:#9fb3d8; }
  .note { color:var(--dim); font-size:12px; }
  .lv.small { font-size:11px; color:var(--dim); }

  /* ── the wheel panel (ports with the component) ── */
  .sw-panel { border:1px solid color-mix(in srgb, var(--acc) 35%, #1c2640); border-radius:4px; margin:10px 0;
    background:linear-gradient(180deg, color-mix(in srgb, var(--acc) 6%, transparent), transparent 40%); }
  .sw-head { width:100%; display:flex; align-items:center; gap:9px; background:none; border:0; padding:7px 10px; cursor:pointer; color:var(--txt); }
  .sw-title { font:11px 'Share Tech Mono', monospace; letter-spacing:2.5px; color:var(--acc); }
  .sw-key { font:600 12px Saira, sans-serif; color:#fff; } .sw-chev { margin-left:auto; color:var(--acc); }
  .sw-body { display:flex; flex-direction:column; align-items:center; padding:0 10px 10px; }
  .sw-info { min-height:34px; text-align:center; font:11.5px 'Share Tech Mono', monospace; color:#b8c6e0; max-width:520px; margin-top:4px; }
  .sw-tag { color:var(--dim); } .sw-hover { color:#fff; }
  .sw-phrases { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; font:11px 'Share Tech Mono', monospace; }
  .sw-phrases b { font-weight:400; opacity:.8; }
  .sw { overflow:visible; max-width:100%; height:auto; }
  .sw-wrap { display:flex; flex-direction:column; align-items:center; }
  .sw-readout { display:flex; flex-direction:column; align-items:center; gap:2px; font:11px 'Share Tech Mono', monospace; min-height:30px; }
  .sw-pay { color:#ffd24a; } .sw-ghost { color:#ffffffaa; } .sw-dim { color:var(--dim); }
  .sw-slot.is-held:hover { filter:brightness(1.15); }
  .sw-phrase { animation:sw-pulse 1.3s ease-in-out infinite; }
  .sw-last { animation:sw-pulse 1.1s ease-in-out infinite; }
  @keyframes sw-pulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }
  .sw-spin { transform-origin:180px 180px; animation:sw-rot 60s linear infinite; }
  .sw-spin-rev { transform-origin:180px 180px; animation:sw-rot 90s linear infinite reverse; }
  @keyframes sw-rot { to { transform:rotate(360deg); } }
  .sw-twinkle { animation:sw-tw 2.4s ease-in-out infinite; }
  @keyframes sw-tw { 0%,100% { opacity:.2; transform:scale(.6); } 50% { opacity:1; transform:scale(1.1); } }
  @keyframes cadence-gold-pulse { 0%,100% { opacity:1; } 50% { opacity:.6; } }
  @media (prefers-reduced-motion: reduce) { .sw-spin, .sw-spin-rev, .sw-twinkle, .sw-phrase, .sw-last { animation:none; } }
</style>
</head>
