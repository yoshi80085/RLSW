:"Medieval church authorities reportedly shunned one musical interval, nicknaming it 'the Devil in music' (diabolus in musica). Which one?",options:["The perfect fifth","The octave","The tritone","The major third"],answer:2,sauce:"That dissonant tritone later became the backbone of blues, jazz and metal \u2014 yes, the same 'Devil's Interval' your game already rewards."},{id:"blues_03",difficulty:"medium",era:"Blues",topic:"artists",question:"Which singer was crowned the 'Empress of the Blues' in the 1920s?",options:["Billie Holiday","Ella Fitzgerald","Ma Rainey","Bessie Smith"],answer:3,sauce:"The highest-paid Black entertainer of the 1920s \u2014 and by one account she once single-handedly chased off a gang of Klansmen messing with her tent show."},{id:"blues_04",difficulty:"easy",era:"Blues",topic:"nicknames",question:"Jazz legend Louis Armstrong's nickname 'Satchmo' was short for what?",options:["Satchel Mouth","Scat Master","Satin Smooth","Saturday Mojo"],answer:0,sauce:"A British editor allegedly misheard an older nickname, 'Satchelmouth,' and 'Satchmo' stuck for the rest of his life."},{id:"blues_05",difficulty:"hard",era:"Blues",topic:"protest",question:"Billie Holiday's haunting 1939 song 'Strange Fruit' was a protest against what?",options:["Prohibition","Lynching in the American South","The Great Depression","Segregated theaters"],answer:1,sauce:"Her label refused to record it, so she cut it for a tiny indie. She closed every show with it \u2014 lights down, no encore."},{id:"blues_06",difficulty:"medium",era:"Blues",topic:"performance",question:"Cab Calloway's 1931 hit 'Minnie the Moocher' helped popularize which vocal style ('hi-de-ho')?",options:["Yodeling","Beatboxing","Scat singing","Falsetto"],answer:2,sauce:"Story goes he forgot the words live on radio, improvised nonsense syllables, and had the whole crowd chanting them back."},{id:"blues_07",difficulty:"hard",era:"Blues",topic:"etymology",question:"In early 1900s slang, the word 'jazz' originally carried what kind of connotation?",options:["Military","Religious","Culinary","Sexual / vulgar"],answer:3,sauce:"Many early players found the term so crude they resisted being labeled with it for years."},{id:"rnr_01",difficulty:"medium",era:"Rock 'n' Roll (1950s)",topic:"censorship",question:"Little Richard's 1955 smash 'Tutti Frutti' had its lyrics rewritten before release because they were too what?",options:["Sexually explicit","Political","Religious","Violent"],answer:0,sauce:"The original was a raunchy ode to a certain 'good booty.' A songwriter sanitized it in about 15 minutes over lunch."},{id:"rnr_02",difficulty:"medium",era:"Rock 'n' Roll (1950s)",topic:"origins",question:"Elvis Presley's 'Hound Dog' was originally a hit three years earlier for which artist?",options:["Etta James","Ruth Brown","Big Mama Thornton","LaVern Baker"],answer:2,sauce:"Her version topped the R&B chart in 1953. Elvis actually copied a Vegas lounge act's cover \u2014 not the original."},{id:"rnr_03",difficulty:"hard",era:"Rock 'n' Roll (1950s)",topic:"scandal",question:"Rock pioneer Jerry Lee Lewis torpedoed his own career in 1958 when the press learned he had married his ___.",options:["manager's daughter","13-year-old cousin","best friend's wife","record producer"],answer:1,sauce:"A British tour collapsed within days and radio blacklisted him. It took a decade to claw back \u2014 as a country star."},{id:"rnr_04",difficulty:"medium",era:"Rock 'n' Roll (1950s)",topic:"myth",question:"Despite the prison songs and outlaw image, how much real prison time did Johnny Cash actually serve?",options:["Essentially none \u2014 a night or two in jail","Four years","Eighteen months","He was never even arrested"],answer:0,sauce:"A handful of overnight arrests, but no real sentence. The outlaw legend was largely... a really good image."},{id:"rnr_05",difficulty:"easy",era:"Rock 'n' Roll (1950s)",topic:"performance",question:"Which rock 'n' roll founder is famous for the 'duck walk' across the stage?",options:["Buddy Holly","Bo Diddley","Carl Perkins","Chuck Berry"],answer:3,sauce:"He claimed he first did it as a kid to hide wrinkles in his rumpled suit \u2014 then kept it because crowds went nuts."},{id:"rnr_06",difficulty:"medium",era:"Rock 'n' Roll (1950s)",topic:"tragedy",question:"The 1959 plane crash that killed Buddy Holly, Ritchie Valens and The Big Bopper became known as ___.",options:["'The Day the Music Died'","'Black Tuesday'","'The Final Encore'","'The Silent Spring'"],answer:0,sauce:"Valens won his seat on the doomed plane with a coin toss. Don McLean's 'American Pie' coined the phrase 12 years later."},{id:"60s_01",difficulty:"medium",era:"The 1960s",topic:"songwriting",question:"Keith Richards says he came up with the '(I Can't Get No) Satisfaction' riff how?",options:["On a napkin at breakfast","In his sleep \u2014 he taped it overnight","During a sound check by accident","In a dream about Chuck Berry"],answer:1,sauce:"He found his tape recorder running in the morning: 30 seconds of the riff, then 40 minutes of snoring."},{id:"60s_02",difficulty:"easy",era:"The 1960s",topic:"meaning",question:"John Lennon always insisted 'Lucy in the Sky with Diamonds' was NOT about LSD, but inspired by what?",options:["A Lewis Carroll book","His son's nursery drawing","A dream about Yoko","A diamond advert"],answer:1,sauce:"His son Julian drew a classmate, Lucy, 'in the sky with diamonds.' The L-S-D initials? Lennon swore it was coincidence."},{id:"60s_03",difficulty:"hard",era:"The 1960s",topic:"scandal",question:"The FBI spent over two years investigating The Kingsmen's 'Louie Louie' (1963) for what?",options:["Communist messaging","Copyright theft","Allegedly obscene lyrics","Tax fraud"],answer:2,sauce:"They concluded the lyrics were 'unintelligible at any speed' and gave up. The singer just mumbled."},{id:"60s_04",difficulty:"easy",era:"The 1960s",topic:"performance",question:"At the 1967 Monterey Pop Festival, Jimi Hendrix ended his set by doing what to his guitar?",options:["Setting it on fire","Throwing it into the sea","Giving it to a fan","Restringing it live"],answer:0,sauce:"He knelt, doused it in lighter fluid, and lit it like an altar offering. The photos made him an instant icon in America."},{id:"60s_05",difficulty:"hard",era:"The 1960s",topic:"behind-the-scenes",question:"Motown's run of '60s hits was powered by an uncredited house band known as the ___.",options:["Wrecking Crew","Swampers","Funk Brothers","Memphis Horns"],answer:2,sauce:"They're often said to have played on more #1 hits than the Beatles, Stones and Beach Boys combined \u2014 yet went unnamed for decades."},{id:"60s_06",difficulty:"medium",era:"The 1960s",topic:"studio",question:"While writing his most ambitious music, Brian Wilson of the Beach Boys reportedly installed a piano where?",options:["In a swimming pool","On the beach","In a sandbox in his living room","In a foam-lined booth"],answer:2,sauce:"He filled a box with sand to feel it between his toes as he composed. He also recorded with farm animals and bicycle bells."},{id:"60s_07",difficulty:"easy",era:"The 1960s",topic:"history",question:"The Beatles' final public performance in 1969 took place where?",options:["Shea Stadium","On their Apple HQ rooftop","The Cavern Club","Abbey Road crossing"],answer:1,sauce:"London police shut it down over noise complaints. It was the last time the four of them ever played live together."},{id:"60s_08",difficulty:"medium",era:"The 1960s",topic:"gear",question:"The eerie flute sound opening The Beatles' 'Strawberry Fields Forever' came from an early tape-based keyboard called the ___.",options:["Theremin","Moog","Mellotron","Hammond"],answer:2,sauce:"Each key triggered a strip of pre-recorded tape \u2014 a clunky analog 'sampler' decades before digital sampling existed."},{id:"70s_01",difficulty:"medium",era:"The 1970s",topic:"drama",question:"Fleetwood Mac's 1977 mega-album 'Rumours' was recorded under what circumstances?",options:["In total silence","While every couple in the band was breaking up","In a haunted ch\xE2teau","In under 48 hours"],answer:1,sauce:"Two romances and a marriage were imploding at once. They wrote breakup songs about each other \u2014 then had to harmonize on them."},{id:"70s_02",difficulty:"easy",era:"The 1970s",topic:"panic",question:"A late-'70s moral panic claimed Led Zeppelin's 'Stairway to Heaven' hid what if played backwards?",options:["Satanic messages","Stock tips","A secret recipe","The band's addresses"],answer:0,sauce:"Robert Plant called it ridiculous. 'Backmasking' hysteria swept America regardless."},{id:"70s_03",difficulty:"hard",era:"The 1970s",topic:"history",question:"What 1979 event at a Chicago ballpark became the symbol of the anti-disco backlash?",options:["The Studio 54 raid","Disco Demolition Night","The Bee Gees boycott","The Saturday Night Fever riot"],answer:1,sauce:"A DJ blew up a crate of disco records between games; fans stormed the field and the second game was forfeited. Many saw an ugly undertone."},{id:"70s_04",difficulty:"medium",era:"The 1970s",topic:"myth",question:"The Eagles' 'Hotel California' spawned wild rumors that it was secretly about what?",options:["A real haunted hotel","Satanism / a cult","A prison","A mental institution"],answer:1,sauce:"The band said it was just a metaphor for excess and the dark side of the high life. The rumors only made it bigger."},{id:"70s_05",difficulty:"medium",era:"The 1970s",topic:"image",question:"What was unusual about the band KISS's public image through the 1970s?",options:["They hid their real faces behind makeup for years","They never spoke in interviews","They played in total darkness","They wore identical outfits"],answer:0,sauce:"They kept their bare faces a secret until 1983, when the 'unmasking' became a televised event."},{id:"70s_06",difficulty:"easy",era:"The 1970s",topic:"songcraft",question:"Queen's 'Bohemian Rhapsody' (1975) broke pop convention by having no what?",options:["Drums","Guitar","Chorus","Bridge"],answer:2,sauce:"A six-minute mash of ballad, opera and hard rock. Labels said radio would never touch a song that long \u2014 it became one of the biggest singles ever."},{id:"70s_07",difficulty:"medium",era:"The 1970s",topic:"artists",question:"Which artist brought reggae to a global audience in the 1970s with songs of resistance and unity?",options:["Jimmy Cliff","Peter Tosh","Bob Marley","Desmond Dekker"],answer:2,sauce:"He survived an assassination attempt in 1976 and performed two days later: 'The people trying to make this world worse aren't taking a day off. How can I?'"},{id:"70s_08",difficulty:"hard",era:"The 1970s",topic:"censorship",question:"The Sex Pistols' 1977 single 'God Save the Queen' was banned by the BBC for what?",options:["Mocking the monarchy during the Queen's Jubilee","Profanity","Plagiarism","Promoting drugs"],answer:0,sauce:"It reportedly outsold everything that week, but the official chart 'somehow' listed it at #2 to dodge a Jubilee embarrassment."},{id:"80s_01",difficulty:"easy",era:"The 1980s",topic:"history",question:"When MTV launched on August 1, 1981, the first video it aired was, fittingly, ___.",options:["'Thriller'","'Video Killed the Radio Star'","'Billie Jean'","'Take On Me'"],answer:1,sauce:"On-the-nose to the point of prophecy. Ironically MTV barely played Black artists at first \u2014 until 'Billie Jean' forced the door open."},{id:"80s_02",difficulty:"easy",era:"The 1980s",topic:"records",question:"Michael Jackson's 'Thriller' (1982) holds which record?",options:["First digital album","Best-selling album of all time","First cassette-only album","Longest album ever"],answer:1,sauce:"Estimates run past 70 million copies. Its 14-minute horror-movie video cost a then-insane half a million dollars."},{id:"80s_03",difficulty:"medium",era:"The 1980s",topic:"gear",question:"The Roland TR-808 drum machine flopped on release, then went on to define which genres?",options:["Country and folk","Bluegrass and jazz","Hip-hop and electronic","Opera and classical"],answer:2,sauce:"It sold poorly because the drums sounded 'fake.' Producers loved exactly that \u2014 its booming kick became hip-hop's heartbeat."},{id:"80s_04",difficulty:"hard",era:"The 1980s",topic:"scandal",question:"The 'Parental Advisory: Explicit Content' sticker was created in 1985 after a campaign led by whom?",options:["The PMRC (incl. Tipper Gore)","The FBI","The record labels","The Catholic Church"],answer:0,sauce:"They drew up a 'Filthy Fifteen' list of offending songs. The sticker became a badge of honor that arguably boosted sales."},{id:"80s_05",difficulty:"medium",era:"The 1980s",topic:"censorship",question:"Frankie Goes to Hollywood's 1983 hit 'Relax' was banned by the BBC once a DJ realized it was about what?",options:["Sex","Drugs","Politics","Religion"],answer:0,sauce:"The ban shot it straight to #1, where it parked for weeks. Nothing sells like forbidden."},{id:"80s_06",difficulty:"medium",era:"The 1980s",topic:"crossover",question:"The 1986 collaboration that fused rap and rock was Run-DMC covering which band's song?",options:["Led Zeppelin","Aerosmith ('Walk This Way')","AC/DC","The Rolling Stones"],answer:1,sauce:"Run-DMC initially thought the original was corny. The crossover revived Aerosmith's dead career and broke rap onto MTV."},{id:"80s_07",difficulty:"medium",era:"The 1980s",topic:"live",question:"The 1985 Live Aid famine-relief concert is often said to have been stolen by whose set?",options:["U2's","Queen's","Led Zeppelin's","Madonna's"],answer:1,sauce:"Freddie Mercury had all 72,000 of Wembley in his palm \u2014 frequently voted the greatest live performance in rock history."},{id:"90s_01",difficulty:"medium",era:"The 1990s",topic:"origins",question:"Nirvana's 'Smells Like Teen Spirit' got its title from what?",options:["A poem","A teen magazine","A deodorant brand scrawled on Kurt's wall","A perfume Courtney Love wore"],answer:2,sauce:"A friend wrote 'Kurt smells like Teen Spirit' as a joke about a girlfriend's deodorant. Cobain didn't even know it was a brand until after the song blew up."},{id:"90s_02",difficulty:"hard",era:"The 1990s",topic:"scandal",question:"Pop duo Milli Vanilli were stripped of their 1990 Best New Artist Grammy after it emerged they had done what?",options:["Not sung a note on the album","Stolen the melodies","Faked their ages","Plagiarized a rival"],answer:0,sauce:"The truth surfaced when their backing track skipped and looped live on MTV. It's still the only Grammy ever revoked."},{id:"90s_03",difficulty:"easy",era:"The 1990s",topic:"history",question:"The mid-'90s 'East Coast vs. West Coast' hip-hop feud centered on which two artists, both later killed in unsolved shootings?",options:["Jay-Z and Nas","Tupac and The Notorious B.I.G.","Dr. Dre and Eazy-E","Snoop and DMX"],answer:1,sauce:"Once friends, both were killed six months apart in 1996\u201397. Both cases remain officially unsolved."},{id:"90s_04",difficulty:"medium",era:"The 1990s",topic:"rivalry",question:"The 1995 'Battle of Britpop' saw which two bands drop singles on the same day as a chart showdown?",options:["Pulp and Suede","The Verve and Radiohead","Blur and Oasis","Spice Girls and Take That"],answer:2,sauce:"Blur won the battle (the #1 single); Oasis won the war (the bigger album and global fame)."},{id:"90s_05",difficulty:"medium",era:"The 1990s",topic:"gear",question:"Cher's 1998 hit 'Believe' was the first major song to deliberately flaunt which now-everywhere studio effect?",options:["Reverb","Auto-Tune","Distortion","The wah pedal"],answer:1,sauce:"Producers coyly called it 'a vocoder' to protect the trick. The robotic warble was 'the Cher effect' years before T-Pain made it a genre."},{id:"90s_06",difficulty:"hard",era:"The 1990s",topic:"business",question:"The Wu-Tang Clan's contract was unusual because each member could do what?",options:["Sign solo deals with different labels","Only record in Staten Island","Never tour separately","Use a single shared microphone"],answer:0,sauce:"Letting members sign individually elsewhere was a radical move that built a hip-hop empire across rival labels."},{id:"00s_01",difficulty:"medium",era:"The 2000s",topic:"industry",question:"Which metal band became the public face of suing the file-sharing service Napster in 2000?",options:["Megadeth","Metallica","Slayer","Iron Maiden"],answer:1,sauce:"Drummer Lars Ulrich personally hauled a list of 300,000 usernames to Napster's office. Fans turned on the band \u2014 but the suit reshaped the industry."},{id:"00s_02",difficulty:"hard",era:"The 2000s",topic:"sampling",question:"Beyonc\xE9's 2003 breakout 'Crazy in Love' is built on a horn sample from which group?",options:["The Temptations","Earth, Wind & Fire","The Chi-Lites","The O'Jays"],answer:2,sauce:"Producer Rich Harrison flipped the Chi-Lites' 'Are You My Woman.' Beyonc\xE9 reportedly hated the track at first."},{id:"00s_03",difficulty:"medium",era:"The 2000s",topic:"moment",question:"During a 2005 live Hurricane Katrina telethon, Kanye West went off-script to say what?",options:["'George Bush doesn't care about black people'","'The government is lying'","'Donate now or else'","'This is bigger than music'"],answer:0,sauce:"Co-host Mike Myers froze beside him in real time. The unscripted line became one of the decade's defining TV moments."},{id:"00s_04",difficulty:"easy",era:"The 2000s",topic:"tech",question:"Which 2003 launch fundamentally changed how people bought music?",options:["Spotify","The iTunes Store (99\xA2 songs)","YouTube","SoundCloud"],answer:1,sauce:"Selling singles for 99 cents helped kill the album as the default unit \u2014 and gave the industry a legal answer to piracy."},{id:"00s_05",difficulty:"easy",era:"The 2000s",topic:"lyrics",question:"OutKast's 2003 smash 'Hey Ya!' tells listeners to 'shake it like a ___.'",options:["tambourine","rag doll","Polaroid picture","bottle of pop"],answer:2,sauce:"Polaroid itself reportedly had to remind people to STOP shaking their photos \u2014 it doesn't actually help them develop."},{id:"10s_01",difficulty:"easy",era:"The 2010s\u2013Now",topic:"moment",question:"At the 2009 MTV VMAs, Kanye West infamously interrupted whose acceptance speech?",options:["Beyonc\xE9","Lady Gaga","Taylor Swift","Katy Perry"],answer:2,sauce:"'Imma let you finish, but Beyonc\xE9 had one of the best videos of all time.' It launched a decade-long saga and a thousand memes."},{id:"10s_02",difficulty:"medium",era:"The 2010s\u2013Now",topic:"records",question:"Psy's 'Gangnam Style' (2012) made history as the first video to do what on YouTube?",options:["Hit 1 billion views","Get demonetized","Win a Grammy","Get banned in the US"],answer:0,sauce:"It literally broke YouTube's view counter, which maxed out around 2.1 billion and had to be rebuilt to count higher."},{id:"10s_03",difficulty:"medium",era:"The 2010s\u2013Now",topic:"industry",question:"In December 2013, Beyonc\xE9 shocked the business by releasing her self-titled album how?",options:["As a free download","With zero warning, overnight, fully finished with videos","Only on vinyl","One song per week"],answer:1,sauce:"No singles, no press, no announcement \u2014 it just appeared. The 'surprise drop' became a standard A-list move afterward."},{id:"10s_04",difficulty:"medium",era:"The 2010s\u2013Now",topic:"controversy",question:"Lil Nas X's 'Old Town Road' (2019) caused an uproar when Billboard removed it from which chart?",options:["The pop chart","The R&B chart","The country chart","The dance chart"],answer:2,sauce:"Billboard said it wasn't 'country enough.' A Billy Ray Cyrus remix and a genre debate later, it sat at #1 for a record 19 weeks."},{id:"10s_05",difficulty:"easy",era:"The 2010s\u2013Now",topic:"viral",question:"In 2020, a viral TikTok of a man skateboarding while sipping cranberry juice sent which 1977 song back up the charts?",options:["Queen's 'Bohemian Rhapsody'","The Eagles' 'Hotel California'","Fleetwood Mac's 'Dreams'","ABBA's 'Dancing Queen'"],answer:2,sauce:"Decades-old 'Dreams' re-entered the top 40. Band members and a juice brand joined the trend; the vibes were, officially, immaculate."},{id:"10s_06",difficulty:"medium",era:"The 2010s\u2013Now",topic:"records",question:"Billie Eilish's debut album, which swept the 2020 Grammys, was recorded mostly where?",options:["A Malibu mansion","Her brother's small bedroom","Abbey Road Studios","A converted church"],answer:1,sauce:"She and brother Finneas made it in his childhood bedroom. At 18 she became the youngest to sweep the 'big four' Grammy categories."},{id:"10s_07",difficulty:"hard",era:"The 2010s\u2013Now",topic:"industry",question:"Around the mid-2010s, what overtook downloads and CDs as the music industry's biggest revenue source?",options:["Vinyl","Streaming","Ringtones","Live concerts"],answer:1,sauce:"A single stream pays a sliver of a cent, reshaping how artists earn \u2014 and part of why songs got shorter and hookier."},{id:"lore_01",difficulty:"hard",era:"Theory, Gear & Studio Lore",topic:"sampling",question:"The most-sampled drum break in history \u2014 the spine of jungle, drum 'n' bass and countless hip-hop tracks \u2014 is known as the ___.",options:["Funky Drummer","Apache break","Amen break","Cold Sweat"],answer:2,sauce:"It's six seconds from The Winstons' 1969 B-side 'Amen, Brother.' The drummer was never paid for it and reportedly died with little money."},{id:"lore_02",difficulty:"easy",era:"Theory, Gear & Studio Lore",topic:"pop culture",question:"Thanks to a famous SNL sketch, which Blue \xD6yster Cult song is forever linked to demands for 'more cowbell'?",options:["'(Don't Fear) The Reaper'","'Burnin' for You'","'Godzilla'","'Cities on Flame'"],answer:0,sauce:"The cowbell really is on the record. Will Ferrell's sketch turned a tiny production quirk into immortal comedy."},{id:"lore_03",difficulty:"medium",era:"Theory, Gear & Studio Lore",topic:"myth",question:"A stubborn urban legend claims Phil Collins's 'In the Air Tonight' is about him witnessing what?",options:["A bank robbery","A man let someone drown","A car crash he caused","A murder at a gig"],answer:1,sauce:"Completely false \u2014 Collins has debunked it for decades. The drowning-revenge story is one of pop's most persistent myths."},{id:"lore_04",difficulty:"hard",era:"Theory, Gear & Studio Lore",topic:"tuning",question:"Conspiracy theorists argue music should be tuned to 432 Hz instead of the modern standard of ___ Hz.",options:["440","420","444","400"],answer:0,sauce:"The 440 Hz standard is real; claims that 432 is 'natural' or that 440 was a sinister plot are pseudoscience \u2014 but they thrive online."},{id:"lore_05",difficulty:"medium",era:"Theory, Gear & Studio Lore",topic:"studio",question:"Which is TRUE of many classic recordings from the 1950s\u201360s?",options:["Entire hits were often cut live in one or two takes","Vocals were always added last","Drums were banned in studios","Songs had to be under two minutes by law"],answer:0,sauce:"Studio time was money. Bands rehearsed hard and nailed legends in a single afternoon \u2014 Little Richard and Chuck Berry among them."},{id:"lore_06",difficulty:"easy",era:"Theory, Gear & Studio Lore",topic:"names",question:"Before he was Bob Dylan, the folk icon was born under what name?",options:["Robert Allen","Robert Zimmerman","Bobby Dylan Thomas","Robert Dean"],answer:1,sauce:"He reportedly took 'Dylan' as a nod to poet Dylan Thomas \u2014 then gave shifting, often invented stories about why."},{id:"blues_08",difficulty:"medium",era:"Blues & Early Jazz (1920s\u201340s)",topic:"legend",question:"Gypsy-jazz guitar genius Django Reinhardt developed his lightning style after losing the use of two fingers in what?",options:["A bar fight","A caravan fire","A factory accident","Frostbite"],answer:1,sauce:"A fire in his wagon left two fingers on his fretting hand paralyzed. He reinvented his entire technique around the working two \u2014 and outplayed everybody anyway."},{id:"blues_09",difficulty:"hard",era:"Blues & Early Jazz (1920s\u201340s)",topic:"history",question:"The 1920 record widely credited as the first vocal blues recording by a Black artist was 'Crazy Blues' by whom?",options:["Mamie Smith","Bessie Smith","Ma Rainey","Ethel Waters"],answer:0,sauce:"Labels assumed nobody would buy it. It sold a million copies and basically launched the entire 'race records' industry overnight."},{id:"blues_10",difficulty:"medium",era:"Blues & Early Jazz (1920s\u201340s)",topic:"studio",question:"During his only recording sessions, Robert Johnson reportedly often played while facing what?",options:["A mirror","The corner of the room","An open window","His own shadow"],answer:1,sauce:"Some said he was painfully shy; others think he'd figured out 'corner loading' bounced the sound back warmer. Either way it fed the spooky legend."},{id:"blues_11",difficulty:"medium",era:"Blues & Early Jazz (1920s\u201340s)",topic:"mystery",question:"Big-band leader Glenn Miller vanished in 1944 while doing what?",options:["Sailing to a USO show","Flying across the English Channel","Driving through a blizzard","Hiking in the Alps"],answer:1,sauce:"His small plane disappeared over the Channel in bad weather and was never found. Decades of theories \u2014 none ever confirmed."},{id:"blues_12",difficulty:"hard",era:"Blues & Early Jazz (1920s\u201340s)",topic:"nicknames",question:"Billie Holiday's famous nickname 'Lady Day' was given to her by which fellow jazz great?",options:["Duke Ellington","Count Basie","Lester Young","Dizzy Gillespie"],answer:2,sauce:"Saxophonist Lester Young crowned her 'Lady Day'; she returned the favor by dubbing him 'Prez' (the President). The nicknames stuck forever."},{id:"blues_13",difficulty:"hard",era:"Blues & Early Jazz (1920s\u201340s)",topic:"history",question:"The first commercially released jazz record (1917) was 'Livery Stable Blues' by a band that imitated barnyard animals on their horns. Who were they?",options:["King Oliver's Creole Jazz Band","The Original Dixieland Jass Band","Fletcher Henderson's Orchestra","The Hot Five"],answer:1,sauce:"The horns literally whinnied and crowed. A novelty gimmick on the first-ever jazz record \u2014 and the band spelled it 'Jass.'"},{id:"blues_14",difficulty:"hard",era:"Blues & Early Jazz (1920s\u201340s)",topic:"legend",question:"According to a famous story, pianist Fats Waller was once kidnapped at gunpoint and forced to perform at whose birthday party?",options:["Al Capone's","President Roosevelt's","Bessie Smith's","Charlie Chaplin's"],answer:0,sauce:"The tale goes he was hustled into a club, realized it was Capone's party, and played for days \u2014 leaving stuffed with cash and champagne."},{id:"rnr_07",difficulty:"medium",era:"Rock 'n' Roll & R&B (1950s)",topic:"history",question:"In December 1956, an impromptu Sun Records jam session captured Elvis, Carl Perkins, Jerry Lee Lewis and Johnny Cash. It became known as the ___.",options:["Memphis Summit","Million Dollar Quartet","Sun Sessions","Rockabilly Round"],answer:1,sauce:"A reporter snapped the photo and ran the name. The tapes weren't even released for decades \u2014 a totally accidental supergroup."},{id:"rnr_08",difficulty:"hard",era:"Rock 'n' Roll & R&B (1950s)",topic:"religion",question:"At the height of his fame in 1957, Little Richard abruptly quit rock 'n' roll to become a preacher after what?",options:["A doctor's warning","Seeing what he took as a fireball / sign in the sky","A failed marriage","A contract dispute"],answer:1,sauce:"Mid-tour, he saw a bright object streak overhead (likely Sputnik) and took it as God's warning. He hurled his rings into a river and walked away \u2014 for a while."},{id:"rnr_09",difficulty:"medium",era:"Rock 'n' Roll & R&B (1950s)",topic:"censorship",question:"By Elvis Presley's third Ed Sullivan Show appearance in 1957, cameras famously filmed him only ___.",options:["from the waist up","in black and white","from behind","in slow motion"],answer:0,sauce:"His hips were deemed too scandalous for TV. The waist-up shot only made teenagers more desperate to see what they were missing."},{id:"rnr_10",difficulty:"hard",era:"Rock 'n' Roll & R&B (1950s)",topic:"origins",question:"Chuck Berry's first hit 'Maybellene' (1955) was reworked from which earlier style of tune?",options:["A gospel hymn","An old country fiddle song","A sea shanty","A polka"],answer:1,sauce:"He souped up the country tune 'Ida Red.' DJ Alan Freed mysteriously got a co-writing credit for spinning it \u2014 a tidy little payola arrangement."},{id:"rnr_11",difficulty:"medium",era:"Rock 'n' Roll & R&B (1950s)",topic:"scandal",question:"The DJ often credited with popularizing the term 'rock and roll' saw his career destroyed by which late-'50s scandal?",options:["Tax evasion","The payola bribery scandal","A plagiarism suit","A drug bust"],answer:1,sauce:"Alan Freed admitted taking cash to play records. The payola hearings made him the fall guy while the practice quietly carried on everywhere."},{id:"rnr_12",difficulty:"easy",era:"Rock 'n' Roll & R&B (1950s)",topic:"history",question:"Bill Haley's 'Rock Around the Clock' exploded into the first rock 'n' roll #1 after appearing where?",options:["On the radio only","Over the opening of the film 'Blackboard Jungle'","On a cereal box","At the Newport festival"],answer:1,sauce:"It had flopped on first release. Slapped over a teen-delinquent movie a year later, it detonated \u2014 and panicked parents everywhere."},{id:"60s_09",difficulty:"easy",era:"The 1960s",topic:"songwriting",question:"Paul McCartney's working lyric for 'Yesterday' \u2014 used while he found real words \u2014 was what?",options:["'Scrambled Eggs'","'Cold Toast'","'Lonely Monday'","'Misty Morning'"],answer:0,sauce:"'Scrambled eggs, oh my baby how I love your legs...' He woke up with the melody fully formed and spent weeks convinced he'd stolen it from someone."},{id:"60s_10",difficulty:"medium",era:"The 1960s",topic:"history",question:"At the 1965 Newport Folk Festival, Bob Dylan outraged purists by doing what?",options:["Playing an electric set","Refusing to perform","Singing in French","Quitting halfway"],answer:0,sauce:"Plugging in 'betrayed' the folk crowd; legend says some booed and Pete Seeger wanted to cut the cables. The electric era arrived anyway."},{id:"60s_11",difficulty:"medium",era:"The 1960s",topic:"origins",question:"Aretha Franklin's defining anthem 'Respect' (1967) was originally written and recorded two years earlier by whom?",options:["Sam Cooke","Otis Redding","Wilson Pickett","Marvin Gaye"],answer:1,sauce:"She flipped a man's plea into a woman's demand, added the 'R-E-S-P-E-C-T' spell-out and 'sock it to me.' Redding admitted she'd stolen it from him for good."},{id:"60s_12",difficulty:"medium",era:"The 1960s",topic:"behind-the-scenes",question:"The Monkees caused a scandal when fans learned they hadn't done what on their early records?",options:["Written any lyrics","Played their own instruments","Recorded in the US","Met in person"],answer:1,sauce:"Session pros (the famed Wrecking Crew) handled the playing. The band publicly revolted, fought for control, and started playing for real."},{id:"60s_13",difficulty:"easy",era:"The 1960s",topic:"live",question:"Closing the 1969 Woodstock festival, Jimi Hendrix delivered a searing solo guitar version of what?",options:["'Purple Haze'","'The Star-Spangled Banner'","'Hey Joe'","'America the Beautiful'"],answer:1,sauce:"He bent the national anthem into screaming dive-bombs and feedback \u2014 heard by many as the sound of Vietnam. He played to a field mostly emptied out by Monday morning."},{id:"60s_14",difficulty:"hard",era:"The 1960s",topic:"art",question:"The cover of 'The Velvet Underground & Nico' (1967) featured a banana designed by which artist \u2014 with a peelable sticker on early copies?",options:["Roy Lichtenstein","Andy Warhol","Keith Haring","Peter Blake"],answer:1,sauce:"'Peel slowly and see' revealed a fleshy pink banana underneath. The peel-able gimmick slowed production so badly it helped tank early sales."},{id:"60s_15",difficulty:"medium",era:"The 1960s",topic:"production",question:"Producer Phil Spector's signature dense, layered recording technique was nicknamed the ___.",options:["Wall of Sound","Memphis Groove","Big Room","Velvet Mix"],answer:0,sauce:"He crammed armies of musicians into one room to make a 'Wagnerian' pop roar. Brilliant in the studio; his story off-mic ended very darkly."},{id:"60s_16",difficulty:"hard",era:"The 1960s",topic:"gear",question:"The eerie, swooping sound in the Beach Boys' 'Good Vibrations' (1966) came from an instrument often mistaken for a theremin \u2014 actually the ___.",options:["Ondes Martenot","Electro-Theremin","Mellotron","Moog"],answer:1,sauce:"A trombonist slid a knob to control pitch on a custom 'Electro-Theremin.' Brian Wilson called the track his 'pocket symphony' \u2014 and nearly lost his mind making it."},{id:"70s_09",difficulty:"medium",era:"The 1970s",topic:"performance",question:"In 1973, David Bowie stunned fans mid-concert by announcing he was 'retiring' \u2014 but he was really killing off what?",options:["His backing band","His Ziggy Stardust persona","His record label","His marriage"],answer:1,sauce:"He'd only told his band moments before. He wasn't quitting music \u2014 just murdering his alien alter ego onstage to free himself from it."},{id:"70s_10",difficulty:"hard",era:"The 1970s",topic:"origins",question:"Black Sabbath guitarist Tony Iommi shaped the heavy sound of metal partly because a factory accident did what?",options:["Cost him the tips of two fingers","Damaged his hearing","Broke his arm","Burned his hands"],answer:0,sauce:"He lost two fingertips on his last day at a sheet-metal job, fashioned thimbles from a melted bottle, and detuned the strings to ease the pain \u2014 inventing metal's heavy, downtuned chug."},{id:"70s_11",difficulty:"medium",era:"The 1970s",topic:"names",question:"Every member of the Ramones used the surname 'Ramone,' though none were related. They borrowed it from whose old stage alias?",options:["Paul McCartney's","Mick Jagger's","Lou Reed's","Iggy Pop's"],answer:0,sauce:"McCartney once checked into hotels as 'Paul Ramon.' The band loved it \u2014 fake brothers, real attitude, three chords, no mercy."},{id:"70s_12",difficulty:"medium",era:"The 1970s",topic:"gear",question:"Donna Summer's 1977 hit 'I Feel Love' was groundbreaking because its backing was made entirely from what?",options:["A live orchestra","A synthesizer (no real instruments)","Tape loops of birdsong","A single piano"],answer:1,sauce:"Producer Giorgio Moroder built the whole pulsing track on a Moog. Brian Eno declared it 'the sound of the future' \u2014 and it basically birthed electronic dance music."},{id:"70s_13",difficulty:"hard",era:"The 1970s",topic:"lawsuit",question:"George Harrison lost a famous plagiarism case when a court ruled his 'My Sweet Lord' had 'subconsciously' copied which song?",options:["'He's So Fine' by The Chiffons","'Stand By Me'","'My Girl'","'Be My Baby'"],answer:0,sauce:"The judge invented the phrase 'subconscious plagiarism' just for him. Harrison joked he was almost afraid to write music afterward."},{id:"70s_14",difficulty:"medium",era:"The 1970s",topic:"myth",question:"A famous fan theory claims Pink Floyd's 'Dark Side of the Moon' (1973) secretly syncs up with which film?",options:["'2001: A Space Odyssey'","'The Wizard of Oz'","'Fantasia'","'Star Wars'"],answer:1,sauce:"Start the album on the third lion roar and odd 'coincidences' pile up. The band has always said it's pure pareidolia \u2014 a happy accident in stoners' minds."},{id:"70s_15",difficulty:"hard",era:"The 1970s",topic:"studio",question:"The relentless drum groove on the Bee Gees' 'Stayin' Alive' (1977) was actually what?",options:["A live drummer playing for hours","A two-bar tape loop run on repeat","A drum machine","Hand claps slowed down"],answer:1,sauce:"With no drummer available, they looped a couple of bars from another track. The phantom 'drummer' got a joke credit: 'Bernard Lupe.'"},{id:"70s_16",difficulty:"medium",era:"The 1970s",topic:"electronic",question:"Which German band's robotic 1970s records ('Autobahn,' 'Trans-Europe Express') went on to deeply influence hip-hop and techno?",options:["Tangerine Dream","Can","Kraftwerk","Neu!"],answer:2,sauce:"They performed as deadpan 'man-machines.' Their grooves were later sampled into early electro and hip-hop, seeding two whole genres."},{id:"80s_08",difficulty:"medium",era:"The 1980s",topic:"performance",question:"At the first MTV VMAs in 1984, Madonna rolled around the stage in a wedding dress performing 'Like a Virgin' and believed she had just done what?",options:["Won an award early","Ruined her career","Lost her voice","Broken the stage"],answer:1,sauce:"Her dress rode up, she improvised, and she crawled offstage sure it was a disaster. It became one of the most iconic TV moments in pop."},{id:"80s_09",difficulty:"medium",era:"The 1980s",topic:"charity",question:"When dozens of superstars gathered to record 'We Are the World' (1985), a sign on the studio door reportedly read what?",options:["'No autographs'","'Check your egos at the door'","'Quiet, genius at work'","'Cash only'"],answer:1,sauce:"Quincy Jones is said to have posted it to keep the megastars in line. They tracked the whole thing in a single overnight session after the Grammys."},{id:"80s_10",difficulty:"easy",era:"The 1980s",topic:"charity",question:"The 1984 UK charity supergroup that recorded 'Do They Know It's Christmas?' was called ___.",options:["USA for Africa","Band Aid","Live Aid","The Concert Collective"],answer:1,sauce:"Organized in a frantic few weeks, it became the UK's biggest-selling single up to then \u2014 and the spark for the massive Live Aid concerts."},{id:"80s_11",difficulty:"medium",era:"The 1980s",topic:"songwriting",question:"Which 1980s superstar secretly wrote hits for others, including the Bangles' 'Manic Monday'?",options:["Michael Jackson","Prince","George Michael","Lionel Richie"],answer:1,sauce:"Prince wrote it under a pseudonym. He also penned 'Nothing Compares 2 U,' which Sin\xE9ad O'Connor later turned into a global tear-jerker."},{id:"80s_12",difficulty:"hard",era:"The 1980s",topic:"studio",question:"On Metallica's 1988 album '...And Justice for All,' what did fans notice about the new bassist's playing?",options:["It was nearly inaudible in the mix","It was too loud","It was all played on keyboard","It was sped up"],answer:0,sauce:"Newcomer Jason Newsted's bass was buried so low it became a running joke \u2014 widely seen as classic new-guy hazing in the mix."},{id:"80s_13",difficulty:"medium",era:"The 1980s",topic:"production",question:"The huge, explosive 1980s drum sound (think the fill in 'In the Air Tonight') came from accidentally discovering what?",options:["Gated reverb","The wah pedal","Auto-Tune","Distortion"],answer:0,sauce:"An engineer found that a heavily compressed talkback mic, abruptly cut off, made drums sound colossal. That 'gated reverb' defined the decade's snare."},{id:"80s_14",difficulty:"easy",era:"The 1980s",topic:"video",question:"A-ha's 1985 hit 'Take On Me' had a groundbreaking video that mixed live action with what?",options:["Claymation","Pencil-sketch rotoscope animation","Puppets","Black-and-white film noir"],answer:1,sauce:"Animators hand-traced roughly 3,000 frames to make the band sketch itself to life. It nearly didn't chart until that video took over MTV."},{id:"90s_07",difficulty:"hard",era:"The 1990s",topic:"lawsuit",question:"Radiohead's breakthrough 'Creep' (1992) ended up sharing songwriting credit because it resembled which earlier song?",options:["'The Air That I Breathe' by The Hollies","'Wonderwall'","'Wild Horses'","'Africa'"],answer:0,sauce:"The writers of the older tune got a cut. Radiohead grew to loathe 'Creep' so much they dropped it from setlists for years."},{id:"90s_08",difficulty:"easy",era:"The 1990s",topic:"pop",question:"The Spice Girls' 1996 debut single 'Wannabe' launched a slogan that became their whole brand. What was it?",options:["'Girl Power'","'Future Pop'","'Spice World'","'Real Talk'"],answer:0,sauce:"Recorded in about an hour, 'Wannabe' topped charts in dozens of countries. The 'zigazig-ah' line means absolutely nothing \u2014 and everyone sang it anyway."},{id:"90s_09",difficulty:"medium",era:"The 1990s",topic:"live",question:"The disastrous Woodstock '99 festival, meant to revive the '60s spirit, instead ended in ___.",options:["A rainout","Fires, looting and riots","A power outage","A snowstorm"],answer:1,sauce:"Price-gouged water, brutal heat and a tinderbox crowd led to bonfires and destruction. The peace-and-love revival went up in literal flames."},{id:"90s_10",difficulty:"medium",era:"The 1990s",topic:"records",question:"At the 1999 Grammys, Lauryn Hill made history by becoming the first woman to do what in one night?",options:["Win five Grammys","Perform twice","Refuse an award","Win Album of the Year twice"],answer:0,sauce:"'The Miseducation of Lauryn Hill' swept the show. It remains one of the most acclaimed albums of the decade \u2014 and her only solo studio LP."},{id:"90s_11",difficulty:"easy",era:"The 1990s",topic:"viral",question:"The inescapable 1990s line-dance smash 'Macarena' was recorded by which Spanish duo?",options:["Gipsy Kings","Los del R\xEDo","Las Ketchup","Caf\xE9 Tacvba"],answer:1,sauce:"Two middle-aged flamenco vets wrote it about a woman named Macarena. A remix added the dance, and the world lost its mind for a year."},{id:"90s_12",difficulty:"hard",era:"The 1990s",topic:"misfire",question:"In 1999, country superstar Garth Brooks baffled fans by releasing an album as a fictional rock alter ego named what?",options:["Chris Gaines","Johnny Blaze","Ray Vega","Tommy Stone"],answer:0,sauce:"Goatee, soul patch, emo backstory and all. The bizarre rebrand flopped so hard it quietly killed a planned movie."},{id:"00s_06",difficulty:"hard",era:"The 2000s",topic:"myth",question:"The White Stripes presented Jack and Meg as siblings, but they were really what?",options:["Cousins","A divorced couple","Childhood neighbors","Bandmates only"],answer:1,sauce:"They'd been married and divorced before the band took off. The brother-sister story (and matching red-and-white look) kept the mystery \u2014 and the focus on the music."},{id:"00s_07",difficulty:"hard",era:"The 2000s",topic:"tech",question:"Gnarls Barkley's 'Crazy' (2006) made history as the first song to top the UK chart how?",options:["On streaming alone","On downloads alone, before a physical release","On vinyl only","Via ringtone sales"],answer:1,sauce:"The duo pulled it from shops at its peak so people would 'remember it fondly' rather than overplay it. The download-only #1 changed chart rules for good."},{id:"00s_08",difficulty:"medium",era:"The 2000s",topic:"industry",question:"The Arctic Monkeys' rapid rise in the mid-2000s is often credited to fans spreading their demos via what?",options:["MySpace and file-sharing","Radio request lines","TV talent shows","Newspaper flexi-discs"],answer:0,sauce:"Fans uploaded demos the band had given away free at gigs. By their own account, the group barely knew what MySpace was \u2014 yet it made them the fastest-selling UK debut act ever."},{id:"00s_09",difficulty:"medium",era:"The 2000s",topic:"biography",question:"Rapper 50 Cent built his hardened image partly around the fact that in 2000 he survived being ___.",options:["shot nine times","jailed for a decade","in a plane crash","struck by lightning"],answer:0,sauce:"He was shot at close range and lived, even keeping a piece of bullet in his face. The story became central to his blockbuster debut."},{id:"00s_10",difficulty:"easy",era:"The 2000s",topic:"image",question:"What is famously true of the French electronic duo Daft Punk?",options:["They never released an album","They perform in robot helmets to hide their faces","They only play acoustic","They never tour"],answer:1,sauce:"They claimed a 'studio accident' in 1999 turned them into robots. The mystique let two regular guys walk down any street unrecognized."},{id:"10s_08",difficulty:"medium",era:"The 2010s\u2013Now",topic:"industry",question:"Why did Taylor Swift begin re-recording her old albums as 'Taylor's Version' starting in 2021?",options:["To change the lyrics","Because the rights to her original masters were sold without her","To remix them for streaming","A label requirement"],answer:1,sauce:"After her masters were sold in a deal she opposed, she simply re-recorded them to own the new versions \u2014 and fans pushed the do-overs past the originals."},{id:"10s_09",difficulty:"hard",era:"The 2010s\u2013Now",topic:"records",question:"In 2018, Kendrick Lamar's album 'DAMN.' won which prize never before given to a hip-hop work?",options:["A Nobel","The Pulitzer Prize for Music","A Booker","An Oscar"],answer:1,sauce:"It was the first Pulitzer for Music to go outside classical and jazz \u2014 a watershed for hip-hop's critical standing."},{id:"10s_10",difficulty:"easy",era:"The 2010s\u2013Now",topic:"records",question:"The 2017 mega-hit 'Despacito' rocketed to global records after a remix featuring which surprise guest?",options:["Drake","Justin Bieber","Ed Sheeran","Bruno Mars"],answer:1,sauce:"Bieber reportedly learned the Spanish lyrics phonetically. The remix helped make it one of the most-streamed songs in history."},{id:"10s_11",difficulty:"medium",era:"The 2010s\u2013Now",topic:"records",question:"In 2020, BTS became the first South Korean act to hit #1 on the US Hot 100, with which song?",options:["'Butter'","'Dynamite'","'Boy With Luv'","'Permission to Dance'"],answer:1,sauce:"Their first fully English single cracked the very top of the US chart \u2014 a milestone the K-pop world had been chasing for years."},{id:"10s_12",difficulty:"hard",era:"The 2010s\u2013Now",topic:"industry",question:"In 2016, Frank Ocean escaped his record contract with a clever maneuver involving how many releases?",options:["One \u2014 a quiet single","Two \u2014 a 'contract' album, then his real one independently a day later","Three EPs","None \u2014 he just walked away"],answer:1,sauce:"He delivered one album to fulfill the deal, then dropped his real masterpiece independently the next day \u2014 keeping the lion's share himself."},{id:"10s_13",difficulty:"medium",era:"The 2010s\u2013Now",topic:"lawsuit",question:"After her 2021 smash 'good 4 u' drew comparisons to an earlier hit, Olivia Rodrigo added which band to the songwriting credits?",options:["Green Day","Paramore","No Doubt","Blink-182"],answer:1,sauce:"The chorus echoed Paramore's 'Misery Business,' so they were credited retroactively. Rodrigo handed out several such credits that year."},{id:"lore_07",difficulty:"medium",era:"Theory, Gear & Studio Lore",topic:"myth",question:"The morbid 'Club' that links Jimi Hendrix, Janis Joplin, Jim Morrison, Kurt Cobain and Amy Winehouse refers to musicians who died at what age?",options:["21","25","27","33"],answer:2,sauce:"All died at 27, fueling the eerie '27 Club' lore. Statisticians say it's coincidence \u2014 but the pattern is hard to un-see."},{id:"lore_08",difficulty:"medium",era:"Theory, Gear & Studio Lore",topic:"gear",question:"Leo Fender, who created the Telecaster and Stratocaster, had what surprising limitation?",options:["He was deaf in one ear","He couldn't actually play guitar","He never finished school","He hated rock music"],answer:1,sauce:"A radio repairman by trade, he designed the world's most iconic electric guitars without being able to play a lick himself."},{id:"lore_09",difficulty:"easy",era:"Theory, Gear & Studio Lore",topic:"instruments",question:"The theremin is unique among instruments because it is played how?",options:["With the feet","Without physically touching it","Only underwater","By blowing into it"],answer:1,sauce:"You wave your hands around two antennas to bend pitch and volume from thin air. Its ghostly wail became the sound of sci-fi and horror."},{id:"lore_10",difficulty:"hard",era:"Theory, Gear & Studio Lore",topic:"gear",question:"Queen guitarist Brian May famously built his main guitar, the 'Red Special,' as a teenager out of what?",options:["A surfboard","An old fireplace mantelpiece","A car door","A cricket bat"],answer:1,sauce:"He and his dad carved it from a fireplace beam and used a knitting needle and motorbike-spring bits in the build. He's played that homemade guitar for his whole career."},{id:"lore_11",difficulty:"medium",era:"Theory, Gear & Studio Lore",topic:"theory",question:`Avant-garde composer John Cage's notorious 1952 piece '4'33"' consists entirely of what?`,options:["A single held note","Silence (the performers play nothing)","Backwards tape","Whale sounds"],answer:1,sauce:"Musicians sit without playing; the 'music' is whatever ambient noise the room makes. Audiences have been arguing about whether it's genius or a prank ever since."},{id:"lore_12",difficulty:"hard",era:"Theory, Gear & Studio Lore",topic:"production",question:"The decades-long trend of mastering records louder and louder, crushing their dynamics, is nicknamed the ___.",options:["Loudness War","Bass Race","Treble Trap","Volume Curse"],answer:0,sauce:"Labels chased ever-louder mixes to grab attention, squashing the quiet-to-loud range. Some fans say it made big records sound fatiguing and flat."},{id:"lore_13",difficulty:"easy",era:"Theory, Gear & Studio Lore",topic:"theory",question:"A famous comedy bit shows that an enormous number of pop hits all share the same ___.",options:["drumbeat","four-chord progression","key of D","song length"],answer:1,sauce:"One I\u2013V\u2013vi\u2013IV loop underpins a startling pile of hits across decades. Comedians have medleyed dozens of songs over a single unchanging chord cycle."},{id:"gtr_01",difficulty:"easy",era:"Iconic Guitars & Their Players",topic:"guitars",question:"Blues giant B.B. King gave every one of his Gibson guitars the same name. What was it?",options:["Lucille","Bertha","Stella","Ruby"],answer:0,sauce:"He once ran into a burning dance hall to rescue his guitar \u2014 the fire started in a fight over a woman named Lucille. He named it that to remind himself never to do anything so dumb again."},{id:"gtr_02",difficulty:"medium",era:"Iconic Guitars & Their Players",topic:"guitars",question:"Willie Nelson has played the same battered nylon-string Martin for over 50 years. What's it called?",options:["Old Faithful","Trigger","Bessie","The Mule"],answer:1,sauce:"It has a gaping hole worn clean through the body from decades of strumming with a pick. He's said he'll quit when Trigger does."},{id:"gtr_03",difficulty:"medium",era:"Iconic Guitars & Their Players",topic:"guitars",question:"Eddie Van Halen got his signature tone partly from a guitar he built himself, nicknamed the ___.",options:["Frankenstrat","Red Devil","Patchwork","Bumblebee"],answer:0,sauce:"He cobbled it together from cheap parts and slathered it in striped tape and paint. He even faked extra pickups and switches just to confuse copycats."},{id:"gtr_04",difficulty:"medium",era:"Iconic Guitars & Their Players",topic:"guitars",question:"Jimi Hendrix got his distinctive sound partly because, as a lefty, he did what to a standard Fender Stratocaster?",options:["Tuned it backwards","Flipped a right-handed model and restrung it","Played it behind his head only","Removed two strings"],answer:1,sauce:"Flipping a right-handed Strat upside down subtly changed how the pickups and controls behaved \u2014 part of why nobody could quite copy his tone."},{id:"gtr_05",difficulty:"medium",era:"Iconic Guitars & Their Players",topic:"bass",question:"Paul McCartney's most famous bass is instantly recognizable for its violin-like shape. What brand is it?",options:["Fender","Rickenbacker","H\xF6fner","Gibson"],answer:2,sauce:"He picked the cheap left-handed H\xF6fner partly because its symmetrical shape didn't look 'wrong' when flipped for a lefty. It became one of music's most iconic instruments."},{id:"gtr_06",difficulty:"hard",era:"Iconic Guitars & Their Players",topic:"guitars",question:"Keith Richards gets his signature Stones crunch from a Telecaster set up in a very particular way. How?",options:["Strung with piano wire","Tuned to open G with the lowest string removed","Played with a glass slide only","Wired backwards"],answer:1,sauce:"Five strings, open G \u2014 'five strings, three notes, two fingers, and one a**hole,' as he put it. That tuning is the secret behind riffs like 'Start Me Up.'"},{id:"gtr_07",difficulty:"easy",era:"Iconic Guitars & Their Players",topic:"guitars",question:"AC/DC's schoolboy-uniformed Angus Young is synonymous with which guitar model?",options:["Fender Telecaster","Gibson SG","Gretsch White Falcon","Ibanez RG"],answer:1,sauce:"The lightweight SG let him duck-walk, spin and tumble across the stage. He's worn out dozens of them doing it."},{id:"gtr_08",difficulty:"medium",era:"Iconic Guitars & Their Players",topic:"guitars",question:"The chiming, jangly guitar sound of the mid-'60s Beatles and Byrds came largely from which instrument?",options:["A 12-string Rickenbacker","A nylon-string classical","A lap steel","A baritone guitar"],answer:0,sauce:"George Harrison's Rickenbacker 12-string so dazzled Roger McGuinn that the Byrds built a whole folk-rock sound around it \u2014 sparkly, ringing, unmistakable."},{id:"gtr_09",difficulty:"hard",era:"Iconic Guitars & Their Players",topic:"guitars",question:"Most of Slash's iconic solos on Guns N' Roses' 'Appetite for Destruction' were actually played on what?",options:["A borrowed Stratocaster","A replica Les Paul, not a real Gibson","An acoustic guitar","A bass"],answer:1,sauce:"A manager handed him a luthier-built Les Paul copy when no good real one was around. That 'fake' is on one of rock's biggest-selling debuts."},{id:"gtr_10",difficulty:"medium",era:"Iconic Guitars & Their Players",topic:"technique",question:"Led Zeppelin's Jimmy Page produced eerie sounds live by playing his guitar with what?",options:["A violin bow","A screwdriver","His teeth","A drumstick"],answer:0,sauce:"He sawed a bow across the strings for the haunted middle of 'Dazed and Confused.' For 'Stairway' live he switched to a twin-neck so he didn't have to change guitars."},{id:"gtr_11",difficulty:"medium",era:"Iconic Guitars & Their Players",topic:"guitars",question:"Stevie Ray Vaughan's beloved, road-worn main Stratocaster was simply nicknamed ___.",options:["Number One","Big Red","The Texan","Lightning"],answer:0,sauce:"Battered and refretted endlessly, 'Number One' was practically rebuilt around him. Its heavy strings and high action are a big reason his tone hit so hard."},{id:"gtr_12",difficulty:"hard",era:"Iconic Guitars & Their Players",topic:"bass",question:"Mot\xF6rhead's Lemmy played his bass in an unusual way \u2014 treating it almost like a rhythm guitar on which brand?",options:["Fender Precision","Rickenbacker","Music Man","H\xF6fner"],answer:1,sauce:"He cranked it with distortion and played chords, not just root notes \u2014 which is why Mot\xF6rhead sounds like a wall of guitars with no rhythm guitarist."},{id:"gtr_13",difficulty:"hard",era:"Iconic Guitars & Their Players",topic:"bass",question:"Jazz-fusion bass virtuoso Jaco Pastorius created his singing, voice-like tone by doing what to his Fender Jazz Bass?",options:["Adding a fifth string","Ripping out the frets himself","Tuning it to a cello","Playing it with a bow"],answer:1,sauce:"He pried the frets out and filled the gaps with wood putty, then sealed the neck with boat epoxy. The fretless 'Bass of Doom' let him slide between notes like a human voice."},{id:"gtr_14",difficulty:"hard",era:"Iconic Guitars & Their Players",topic:"guitars",question:"Kurt Cobain liked two Fender models so much he designed a hybrid of them, called the ___.",options:["Jag-Stang","Mustaguar","Jazzcaster","Telejag"],answer:0,sauce:"He literally taped two Polaroids of a Jaguar and a Mustang together and asked Fender to splice them. He received the finished guitar not long before he died."},{id:"gtr_15",difficulty:"medium",era:"Iconic Guitars & Their Players",topic:"bass",question:"Funk legend Bootsy Collins is famous for a flashy custom bass shaped like what?",options:["A lightning bolt","A star","A heart","A flying saucer"],answer:1,sauce:"His glittering 'Space Bass' matched the star-shaped sunglasses and the whole cosmic-funk look. With James Brown and then Parliament-Funkadelic, that bass anchored the groove."},{id:"gtr_16",difficulty:"hard",era:"Iconic Guitars & Their Players",topic:"effects",question:"Rage Against the Machine's Tom Morello mimics scratching and electronic sounds on guitar using a toggle 'kill switch' plus which pedal?",options:["A DigiTech Whammy","A simple reverb tank","A Leslie speaker","A talk box"],answer:0,sauce:"Flipping the pickup switch like a DJ's crossfader, plus the Whammy's pitch-shift, lets him sound like turntables and sirens \u2014 no samples, all guitar."},{id:"gear_01",difficulty:"medium",era:"Amps, Effects & Studio Gear",topic:"effects",question:"Peter Frampton's 'voice-like' guitar on 'Do You Feel Like We Do' came from which device?",options:["A vocoder","A talk box","Auto-Tune","A theremin"],answer:1,sauce:"A tube runs the guitar's sound into the player's mouth, which 'shapes' words with the lips. It's why his guitar seems to literally talk to the crowd."},{id:"gear_02",difficulty:"hard",era:"Amps, Effects & Studio Gear",topic:"keys",question:"The funky, percussive keyboard riff in Stevie Wonder's 'Superstition' was played on which instrument?",options:["A Hammond organ","A Hohner Clavinet","A grand piano","A Mellotron"],answer:1,sauce:"The clav's plucky, almost guitar-like attack defined '70s funk. Wonder layered several takes himself \u2014 he played nearly everything on the track."},{id:"gear_03",difficulty:"medium",era:"Amps, Effects & Studio Gear",topic:"effects",question:"U2 guitarist The Edge built his entire signature style around heavy use of which effect?",options:["Distortion","Delay (echo)","Wah-wah","Flanger"],answer:1,sauce:"Rhythmic, repeating echoes turn a few simple notes into shimmering cascades. Strip the delay away and a lot of those huge U2 parts are surprisingly sparse."},{id:"gear_04",difficulty:"medium",era:"Amps, Effects & Studio Gear",topic:"technique",question:"Queen's Brian May famously plays not with a normal pick, but with what?",options:["His fingernails","A sixpence coin","A guitar slide","A matchstick"],answer:1,sauce:"The hard coin edge gives a scrapier, more controllable attack than plastic. He keeps a stash of old sixpences just for gigs."},{id:"gear_05",difficulty:"hard",era:"Amps, Effects & Studio Gear",topic:"studio",question:"The colossal drum sound on Led Zeppelin's 'When the Levee Breaks' was captured by putting John Bonham's kit where?",options:["In an open field","At the bottom of a stairwell","In a swimming pool","Under a tarp"],answer:1,sauce:"Two mics hung high above a three-story stairwell soaked up huge natural echo. That booming break became one of the most-sampled drum sounds ever."},{id:"gear_06",difficulty:"hard",era:"Amps, Effects & Studio Gear",topic:"synths",question:"The 1968 album 'Switched-On Bach,' which made the synthesizer a serious instrument, was built on which machine?",options:["The Mellotron","The Moog","The Fairlight","The Hammond"],answer:1,sauce:"Wendy Carlos painstakingly played classical pieces one note at a time on a monophonic Moog. The surprise hit convinced rockers the synth was worth a look."},{id:"gear_07",difficulty:"hard",era:"Amps, Effects & Studio Gear",topic:"drum machines",question:"Prince programmed the drums on '1999' and 'When Doves Cry' using which drum machine?",options:["Roland TR-808","LinnDrum","Oberheim DMX","Simmons pads"],answer:1,sauce:"Its crisp, punchy samples shaped his early-'80s 'Minneapolis sound.' Famously, he stripped the bass out of 'When Doves Cry' entirely \u2014 drums and all that empty space."},{id:"gear_08",difficulty:"medium",era:"Amps, Effects & Studio Gear",topic:"effects",question:"That instantly recognizable scratchy guitar opening Isaac Hayes' 'Theme from Shaft' is made with which pedal?",options:["A wah-wah","A fuzz box","A phaser","A tremolo"],answer:0,sauce:"The rhythmic 'wakka-wakka' wah became the sound of '70s funk and cop shows alike. It won an Oscar for Best Original Song \u2014 a first for a Black composer."},{id:"gear_09",difficulty:"medium",era:"Amps, Effects & Studio Gear",topic:"innovators",question:"Besides having a Gibson guitar named after him, Les Paul was a pioneer of what crucial studio technique?",options:["Multitrack recording","Auto-Tune","Digital sampling","Surround sound"],answer:0,sauce:"He layered guitar and vocal parts on top of each other \u2014 'sound on sound' \u2014 long before it was standard. He basically helped invent the modern recording studio."},{id:"gear_10",difficulty:"easy",era:"Amps, Effects & Studio Gear",topic:"amps",question:"The towering wall of amplifiers \u2014 the 'stack' \u2014 that became a symbol of loud rock is most associated with which brand?",options:["Fender","Marshall","Vox","Roland"],answer:1,sauce:"Players like Pete Townshend kept demanding more power, so the company stacked tall cabinets under booming heads. Bands lined the stage with them for sheer spectacle."},{id:"gear_11",difficulty:"hard",era:"Amps, Effects & Studio Gear",topic:"synths",question:"The squelchy, rubbery 'acid' sound at the heart of acid house came from which Roland box?",options:["The TB-303","The TR-909","The Juno-60","The SH-101"],answer:0,sauce:"It was a flop sold as a fake 'bass guitarist' for solo musicians. Producers found cheap secondhand units, twisted the knobs, and accidentally birthed a genre."},{id:"gear_12",difficulty:"hard",era:"Amps, Effects & Studio Gear",topic:"guitars",question:"Pantera's Dimebag Darrell is closely tied to which sharply pointed guitar shape?",options:["The Gibson Flying V","The Dean ML","The Jackson Rhoads","The B.C. Rich Warlock"],answer:1,sauce:"His lightning-bolt 'Dean from Hell' became as iconic as his playing. After he died, the company reissued tribute models in his honor."},{id:"gear_13",difficulty:"hard",era:"Amps, Effects & Studio Gear",topic:"samplers",question:"Kate Bush and Peter Gabriel were early adopters of which pricey 1980s sampler, used on hits like 'Sledgehammer'?",options:["The Akai MPC","The Fairlight CMI","The E-mu SP-1200","The Ensoniq Mirage"],answer:1,sauce:"It cost about as much as a house, so only a handful of stars had one. Those exotic sampled choirs and orchestra hits are all over mid-'80s pop."},{id:"gear_14",difficulty:"medium",era:"Amps, Effects & Studio Gear",topic:"studio",question:"The swirling, watery sound of a Hammond organ \u2014 and of John Lennon's vocal on 'Tomorrow Never Knows' \u2014 comes from running it through what?",options:["A rotating Leslie speaker","A wah pedal","A tape echo","A ring modulator"],answer:0,sauce:"The Leslie spins a speaker horn around, smearing the sound with a Doppler wobble. Lennon liked it so much he asked to be hung upside down to get the effect \u2014 they used the speaker instead."},{id:"guest_01",difficulty:"hard",era:"Famous Guest Appearances \u2014 On Record",topic:"secret guest",question:"Who played the soaring (and originally uncredited) lead guitar on The Beatles' 'While My Guitar Gently Weeps'?",options:["Eric Clapton","Jeff Beck","Peter Green","Jimmy Page"],answer:0,sauce:"George Harrison snuck his pal Clapton into the session to ease the tension between the Beatles. The others were on their best behavior with an outsider in the room."},{id:"guest_02",difficulty:"medium",era:"Famous Guest Appearances \u2014 On Record",topic:"crossover",question:"The blazing guitar solo on Michael Jackson's 'Beat It' was played by which rock star \u2014 reportedly for free?",options:["Slash","Eddie Van Halen","Steve Lukather","Joe Satriani"],answer:1,sauce:"He did it as a favor and took no fee, and reportedly rearranged part of the song while he was at it. He thought no one would ever even know it was him."},{id:"guest_03",difficulty:"hard",era:"Famous Guest Appearances \u2014 On Record",topic:"crossover",question:"The bluesy lead guitar all over David Bowie's 1983 hit 'Let's Dance' was played by which then-unknown Texan?",options:["Stevie Ray Vaughan","Billy Gibbons","Joe Ely","Eric Johnson"],answer:0,sauce:"Bowie spotted him at a festival and called him in. The exposure helped launch SRV's own career almost overnight."},{id:"guest_04",difficulty:"hard",era:"Famous Guest Appearances \u2014 On Record",topic:"secret guest",question:"The gorgeous slide guitar on Derek and the Dominos' 'Layla' was played not by Clapton, but by which guest?",options:["Duane Allman","Lowell George","Ry Cooder","Dickey Betts"],answer:0,sauce:"The Allman Brothers slide wizard guested on the sessions and traded licks with Clapton. He died in a motorcycle crash about a year later, at 24."},{id:"guest_05",difficulty:"hard",era:"Famous Guest Appearances \u2014 On Record",topic:"session legend",question:"The wordless, wailing vocal on Pink Floyd's 'The Great Gig in the Sky' was improvised on the spot by whom?",options:["Clare Torry","Doris Troy","Lisa Strike","Liza Minnelli"],answer:0,sauce:"A session singer was told to just 'feel it' with no lyrics, and nailed that haunting performance fast \u2014 for a flat session fee. Decades later she won a songwriting credit for it."},{id:"guest_06",difficulty:"hard",era:"Famous Guest Appearances \u2014 On Record",topic:"session legend",question:"The searing female vocal trading lines on the Rolling Stones' 'Gimme Shelter' was sung by which guest?",options:["Tina Turner","Merry Clayton","Claudia Lennear","Bonnie Bramlett"],answer:1,sauce:"She was called in the middle of the night, came in over her curlers, and unleashed it in a couple of takes. Listen close and you can hear her voice crack on the high 'murder' \u2014 and the band gasp."},{id:"guest_07",difficulty:"hard",era:"Famous Guest Appearances \u2014 On Record",topic:"credits",question:"Which keyboardist is the only non-Beatle ever credited on a Beatles single (for 'Get Back')?",options:["Nicky Hopkins","Billy Preston","Ian Stewart","Brian Auger"],answer:1,sauce:"His electric piano was so vital they billed it 'The Beatles with Billy Preston.' He was such a calming presence some wished he'd stay in the band."},{id:"guest_08",difficulty:"medium",era:"Famous Guest Appearances \u2014 On Record",topic:"crossover",question:"The big sax solo on Lady Gaga's 2011 hit 'The Edge of Glory' was one of the final recordings by which legend?",options:["Kenny G","Clarence Clemons","Branford Marsalis","David Sanborn"],answer:1,sauce:"Bruce Springsteen's longtime 'Big Man' guested on Gaga's track and died weeks later. She kept the wide-open sax solo in as a tribute."},{id:"guest_09",difficulty:"medium",era:"Famous Guest Appearances \u2014 On Record",topic:"vocals",question:"Who sings the falsetto 'I want my MTV' hook that opens Dire Straits' 'Money for Nothing'?",options:["Sting","Phil Collins","Peter Gabriel","Robert Palmer"],answer:0,sauce:"His line deliberately echoes the tune of The Police's 'Don't Stand So Close to Me.' He ended up with a co-writing credit for those few words."},{id:"guest_10",difficulty:"easy",era:"Famous Guest Appearances \u2014 On Record",topic:"collaboration",question:"The 1999 smash 'Smooth' paired guitarist Carlos Santana with which singer on vocals?",options:["Rob Thomas","Michael Stipe","Dave Matthews","Chris Cornell"],answer:0,sauce:"The Matchbox Twenty frontman co-wrote it and sang lead. The comeback album it anchored swept the Grammys and sold by the truckload."},{id:"guest_11",difficulty:"medium",era:"Famous Guest Appearances \u2014 On Record",topic:"session legend",question:"The crisp funk guitar that drives Daft Punk's 'Get Lucky' was played by which producer-guitarist?",options:["Nile Rodgers","Pharrell Williams","Mark Ronson","John Mayer"],answer:0,sauce:"The Chic mastermind's rhythm guitar is also behind Bowie's 'Let's Dance' and Madonna's 'Like a Virgin.' Few players have fingerprints on so many massive hits."},{id:"guest_12",difficulty:"hard",era:"Famous Guest Appearances \u2014 On Record",topic:"before they were famous",question:"Before her solo career, Sheryl Crow spent two years as a backing singer on whose world tour?",options:["Madonna's","Michael Jackson's","Prince's","Whitney Houston's"],answer:1,sauce:"She sang the female duet part on his Bad tour night after night. She used the paycheck and the contacts to launch herself afterward."},{id:"guest_13",difficulty:"hard",era:"Famous Guest Appearances \u2014 On Record",topic:"before they were famous",question:"Future soul superstar Luther Vandross got an early break singing backing vocals \u2014 and even co-writing \u2014 on which David Bowie album?",options:["'Ziggy Stardust'","'Young Americans'","'Heroes'","'Let's Dance'"],answer:1,sauce:"He arranged backing vocals and co-wrote a track on Bowie's 'plastic soul' record. Years before his own fame, his voice is woven through it."},{id:"guest_14",difficulty:"medium",era:"Famous Guest Appearances \u2014 On Record",topic:"crossover",question:"Freddie Mercury recorded a 1988 duet album with which opera star, including the song 'Barcelona'?",options:["Maria Callas","Montserrat Caball\xE9","Kiri Te Kanawa","Ren\xE9e Fleming"],answer:1,sauce:"The rock frontman idolized the Spanish soprano and talked his way into singing with her. 'Barcelona' later became an anthem for the city's 1992 Olympics."},{id:"guest_15",difficulty:"medium",era:"Famous Guest Appearances \u2014 On Record",topic:"duets",question:"Kate Bush shares the aching lead vocal on the 1986 duet 'Don't Give Up' with which artist?",options:["Peter Gabriel","Sting","Phil Collins","David Gilmour"],answer:0,sauce:"Gabriel wrote it about unemployment and despair, and her gentle parts play the comforting voice. Fun fact: Gilmour helped discover Bush years earlier."},{id:"guest_16",difficulty:"hard",era:"Famous Guest Appearances \u2014 On Record",topic:"collaboration",question:"Elton John played piano and sang on John Lennon's only #1 solo single of the '70s. Which song?",options:["'Imagine'","'Whatever Gets You thru the Night'","'Instant Karma!'","'Mind Games'"],answer:1,sauce:"Elton bet Lennon that if it hit #1, Lennon had to join him on stage. It did \u2014 and Lennon paid up in a way that became history (see the live round)."},{id:"guest_17",difficulty:"easy",era:"Famous Guest Appearances \u2014 On Record",topic:"collaboration",question:"The classic 'Under Pressure' was a collaboration between Queen and which solo star?",options:["Elton John","David Bowie","Rod Stewart","George Michael"],answer:1,sauce:"It reportedly grew out of a loose studio jam, and that famous bassline almost didn't survive their bickering over the mix. Vanilla Ice later 'borrowed' it without asking."},{id:"guest_18",difficulty:"medium",era:"Famous Guest Appearances \u2014 On Record",topic:"crossover",question:"Blues icon B.B. King guested with U2 on which 1988 song?",options:["'Desire'","'When Love Comes to Town'","'Angel of Harlem'","'One'"],answer:1,sauce:"Bono wrote it for him, and King reportedly teased that the young Irishman had crammed too many words in. King's guitar and grit made it soar anyway."},{id:"guest_19",difficulty:"easy",era:"Famous Guest Appearances \u2014 On Record",topic:"duets",question:"Paul McCartney sang the 1982 piano-key-themed duet 'Ebony and Ivory' with whom?",options:["Stevie Wonder","Michael Jackson","Lionel Richie","Billy Joel"],answer:0,sauce:"The two recorded it as a plea for racial harmony. McCartney and Jackson teamed up the same era \u2014 a friendship that later soured over song-catalog rights."},{id:"guest_20",difficulty:"easy",era:"Famous Guest Appearances \u2014 On Record",topic:"charity",question:"For 1985's Live Aid, Mick Jagger and David Bowie released a charity cover of which song?",options:["'Dancing in the Street'","'Twist and Shout'","'Lean on Me'","'Get Up'"],answer:0,sauce:"They cut it fast so both could appear at Live Aid via the video. The clip's goofy, exuberant dancing has been meme fuel for decades."},{id:"live_01",difficulty:"hard",era:"Famous Guest Appearances \u2014 Live & On Tour",topic:"legendary set",question:"At the 2004 Rock & Roll Hall of Fame, who stole the show with a jaw-dropping solo on 'While My Guitar Gently Weeps' \u2014 then flung his guitar into the air, never to be seen again?",options:["Eric Clapton","Prince","Eddie Van Halen","Joe Walsh"],answer:1,sauce:"He stood almost unnoticed, then unloaded a solo that left the all-star band grinning. The tossed guitar vanished into the rafters \u2014 no one's ever produced it."},{id:"live_02",difficulty:"medium",era:"Famous Guest Appearances \u2014 Live & On Tour",topic:"feat",question:"How did Phil Collins manage to perform at Live Aid in both London AND Philadelphia on the same day in 1985?",options:["He pre-recorded one set","He flew between them on Concorde","It was a satellite illusion","He used a body double"],answer:1,sauce:"He played Wembley, jumped on the supersonic jet, and drummed in the US hours later. He even backed Led Zeppelin's reunion set \u2014 which the band later wished he hadn't."},{id:"live_03",difficulty:"medium",era:"Famous Guest Appearances \u2014 Live & On Tour",topic:"history",question:"The first huge all-star benefit concert, in 1971, was organized by George Harrison and Ravi Shankar to aid which region?",options:["Ethiopia","Bangladesh","Biafra","Cambodia"],answer:1,sauce:"Dylan, Clapton, Ringo and others showed up; it basically invented the modern charity mega-concert. A tangle of taxes meant the aid money took years to actually arrive."},{id:"live_04",difficulty:"medium",era:"Famous Guest Appearances \u2014 Live & On Tour",topic:"collaboration",question:"At the 2001 Grammys, Eminem surprised everyone by performing 'Stan' alongside which unlikely guest?",options:["Elton John","Sting","Bono","George Michael"],answer:0,sauce:"Amid loud criticism of Eminem's lyrics, the openly gay pop legend volunteered to duet as a pointed gesture. They reportedly stayed friends long after."},{id:"live_05",difficulty:"easy",era:"Famous Guest Appearances \u2014 Live & On Tour",topic:"reunion",question:"At her headlining 2018 Coachella set ('Beychella'), Beyonc\xE9 surprised fans by reuniting which group on stage?",options:["TLC","Destiny's Child","En Vogue","Salt-N-Pepa"],answer:1,sauce:"Kelly and Michelle popped up mid-set for a mini-reunion. The whole show was widely hailed as one of the greatest festival performances ever staged."},{id:"live_06",difficulty:"hard",era:"Famous Guest Appearances \u2014 Live & On Tour",topic:"unplugged",question:"For Nirvana's famous 1993 'MTV Unplugged' set, Kurt Cobain invited members of which band to join him?",options:["The Meat Puppets","Mudhoney","The Melvins","H\xFCsker D\xFC"],answer:0,sauce:"Instead of obvious hits, he played their obscure songs with them \u2014 baffling MTV. The stripped-down, candlelit show became one of his most beloved performances."},{id:"live_07",difficulty:"hard",era:"Famous Guest Appearances \u2014 Live & On Tour",topic:"history",question:"John Lennon's final major concert appearance was a 1974 cameo joining which friend on stage at Madison Square Garden?",options:["Elton John","David Bowie","Mick Jagger","Paul McCartney"],answer:0,sauce:"It was payment for losing that #1-single bet. The crowd roared at the surprise \u2014 and it turned out to be Lennon's last big live appearance before his death."},{id:"live_08",difficulty:"medium",era:"Famous Guest Appearances \u2014 Live & On Tour",topic:"spectacle",question:"Mick Jagger's wild Live Aid duet with which singer ended with him tearing away part of her skirt on stage?",options:["Tina Turner","Aretha Franklin","Patti LaBelle","Diana Ross"],answer:0,sauce:"Their high-energy romp nearly upstaged the whole US show. The skirt 'malfunction' was very much part of the act."},{id:"live_09",difficulty:"easy",era:"Famous Guest Appearances \u2014 Live & On Tour",topic:"supergroup",question:"Since 1989, Ringo Starr has toured with a rotating cast of famous musicians under what band name?",options:["The Wrecking Crew","The All-Starr Band","The Traveling Wilburys","The Fab Faux"],answer:1,sauce:"Members have included stars from Toto, the Eagles, Santana and beyond, swapping in and out over the years. Everyone gets a turn singing their own hit."},{id:"live_10",difficulty:"medium",era:"Famous Guest Appearances \u2014 Live & On Tour",topic:"breakout",question:"Santana became overnight stars after a blistering set at which 1969 festival \u2014 before they'd even released an album?",options:["Monterey Pop","Woodstock","Isle of Wight","Altamont"],answer:1,sauce:"Carlos Santana has said he played that hypnotic 'Soul Sacrifice' set while tripping, fighting to keep his guitar neck from turning into a snake. His drummer, barely out of his teens, stole the film."},{id:"rig_01",difficulty:"easy",era:"Theory, Gear & Studio Lore",topic:"tuning",question:"Standard tuning on a six-string guitar, lowest string to highest, is which of these?",options:["E A D G B E","E A D G C F","D G C F A D","C G D A E B"],answer:0,sauce:"The odd one out is that B \u2014 every other gap is a fourth, and that single major third is why chord shapes stop being symmetrical and guitarists develop opinions."},{id:"rig_02",difficulty:"easy",era:"Theory, Gear & Studio Lore",topic:"theory",question:"A power chord \u2014 the backbone of punk and metal \u2014 is built from the root plus which interval?",options:["The fifth","The third","The seventh","The second"],answer:0,sauce:"No third means no major and no minor: a power chord is quality-AMBIGUOUS, which is exactly why it sits under any riff without picking a mood. Your Drive Stack knows the feeling."},{id:"rig_03",difficulty:"easy",era:"Amps, Effects & Studio Gear",topic:"amps",question:'"Amp" is short for which word?',options:["Amplifier","Amplitude","Ampere","Ampersand"],answer:0,sauce:"It takes a signal too weak to hear and makes it loud enough to move air \u2014 and, if you ask it nicely and stand close, loud enough to move the guitar too. That last part is feedback."},{id:"rig_04",difficulty:"easy",era:"Amps, Effects & Studio Gear",topic:"effects",question:"Which pedal effect gives a guitar that vocal, crying sweep \u2014 famously rocked with the foot?",options:["Wah-wah","Chorus","Delay","Compressor"],answer:0,sauce:"It is a filter you steer with your ankle: rock the treadle and a peak in the tone sweeps up and down, which the human ear hears as a voice saying a vowel."},{id:"rig_05",difficulty:"easy",era:"Iconic Guitars & Their Players",topic:"guitars",question:"The Les Paul is the flagship solid-body of which guitar company?",options:["Gibson","Fender","Gretsch","Rickenbacker"],answer:0,sauce:"Les Paul was a real player and inventor who lent his name to it \u2014 and who also pioneered multitrack recording, so he is arguably responsible for the guitar AND for the studio you overdub it in."},{id:"rig_06",difficulty:"easy",era:"Iconic Guitars & Their Players",topic:"guitars",question:"Jimi Hendrix famously played a right-handed Fender Stratocaster in what way?",options:["Flipped upside down and restrung for his left hand","Tuned to open G with a slide","With the neck detached","Strung with bass strings"],answer:0,sauce:"Flipping it moved the controls and the angled pickup, which changed the tone as well as the ergonomics \u2014 part of that sound is literally a right-handed guitar being played wrong."},{id:"rig_07",difficulty:"easy",era:"Theory, Gear & Studio Lore",topic:"instruments",question:"How many strings does a standard bass guitar have?",options:["Four","Five","Six","Eight"],answer:0,sauce:"Tuned E A D G \u2014 the bottom f
