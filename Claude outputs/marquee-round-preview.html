our of a guitar, an octave down. Five- and six-string basses exist and mostly add a low B, which is the note that makes PA speakers file a complaint."},{id:"rig_08",difficulty:"easy",era:"Theory, Gear & Studio Lore",topic:"theory",question:"A time signature of 4/4 means how many beats in a bar?",options:["Four","Three","Six","Two"],answer:0,sauce:'So common it is written as C for "common time". Almost everything you can nod your head to is in it, which is why the songs that are NOT stand out so violently.'},{id:"rig_09",difficulty:"easy",era:"Theory, Gear & Studio Lore",topic:"instruments",question:"How many keys does a standard full-size piano have?",options:["88","72","96","64"],answer:0,sauce:"Fifty-two white and thirty-six black, spanning a bit over seven octaves \u2014 the range settled where it did because past either end the strings stop sounding like notes and start sounding like noise."},{id:"rig_10",difficulty:"easy",era:"Amps, Effects & Studio Gear",topic:"effects",question:"What is a reverb effect simulating?",options:["The sound of a space \u2014 a room, a hall, a cathedral","A doubled vocal","A faster tempo","A detuned string"],answer:0,sauce:"Before it was a plugin it was a physical fact: engineers put speakers in stairwells, chambers and even tiled bathrooms, played the track in and recorded the room answering back."},{id:"rig_11",difficulty:"easy",era:"Amps, Effects & Studio Gear",topic:"technique",question:"In a standard drum kit, which pair of cymbals is opened and closed with a foot pedal?",options:["The hi-hat","The ride","The crash","The splash"],answer:0,sauce:"Closed it ticks, open it sizzles, and the moment a drummer lets it breathe on the chorus is one of the oldest tricks for making a song feel like it just got bigger."},{id:"rig_12",difficulty:"easy",era:"Theory, Gear & Studio Lore",topic:"technique",question:"Play the twelfth fret of a guitar string instead of letting it ring open. What have you done to the pitch?",options:["Raised it exactly one octave","Raised it a fifth","Lowered it an octave","Nothing \u2014 it is the same note"],answer:0,sauce:"Halve the length of a vibrating string and you double its frequency. The twelfth fret is the exact midpoint, which is why that is where the big dot marker lives."},{id:"rig_13",difficulty:"easy",era:"Theory, Gear & Studio Lore",topic:"gear",question:"What does a capo do when clamped across a guitar's neck?",options:["Raises the pitch of every string by shortening them","Lowers the tuning by a whole step","Mutes the low strings","Holds the strings down for barre chords only"],answer:0,sauce:"It is a movable nut. Singers love it because it moves the KEY without moving the shapes \u2014 the same three chords, somewhere your voice can actually live."},{id:"rig_14",difficulty:"easy",era:"Amps, Effects & Studio Gear",topic:"studio",question:"What does DAW stand for in a modern studio?",options:["Digital Audio Workstation","Direct Amplified Wave","Dynamic Analogue Wiring","Doubled Audio Waveform"],answer:0,sauce:"The reason a bedroom can out-spec a 1970s console room. The catch is that unlimited takes and unlimited undo removed the one thing tape gave you for free: a reason to commit."},{id:"rig_15",difficulty:"medium",era:"Amps, Effects & Studio Gear",topic:"amps",question:`Which amplifier maker's "Plexi" heads defined the roar of late-60s British rock?`,options:["Marshall","Vox","Orange","Ampeg"],answer:0,sauce:"Named for the Plexiglas panel on the front. The sound is an amp being asked for more than it can politely give \u2014 the distortion everyone chases was originally a fault."},{id:"rig_16",difficulty:"medium",era:"Theory, Gear & Studio Lore",topic:"tuning",question:"Drop D tuning drops which string, and by how much?",options:["The low E, down a whole step to D","The high E, down a semitone","The A string, down to G","All six, down a semitone"],answer:0,sauce:"It puts a one-finger power chord under your index and hands you a low D the guitar did not have. Cheap, instant heaviness \u2014 which is why half of the 1990s is in it."},{id:"rig_17",difficulty:"medium",era:"Iconic Guitars & Their Players",topic:"guitars",question:"The humbucking pickup, designed at Gibson in the 1950s, was invented to cancel what?",options:["Electrical hum picked up from the mains","String buzz against the frets","Feedback from the amplifier","Finger noise on wound strings"],answer:0,sauce:"Two coils wired out of phase with opposite magnets: the hum arrives at both the same way and cancels, the string signal does not. Fatter tone was a side effect that ate the world."},{id:"rig_18",difficulty:"medium",era:"Amps, Effects & Studio Gear",topic:"drum machines",question:"The Roland TR-808 sold poorly on release, then became one of the most sampled machines ever. What is its signature sound?",options:["A long, booming, tuneable kick drum","A realistic acoustic snare","A sampled orchestral hit","A vinyl crackle loop"],answer:0,sauce:"It struggled because it did not sound like a real kit. Hip-hop and electro heard a machine that sounded like ITSELF, and that kick has been rattling car boots ever since."},{id:"rig_19",difficulty:"medium",era:"Amps, Effects & Studio Gear",topic:"studio",question:"What does a compressor do to a signal?",options:["Narrows the gap between loud and quiet","Removes unwanted frequencies","Adds an echo","Shifts the pitch"],answer:0,sauce:"Turn the loud bits down, then turn the whole thing up: the quiet detail rises and the track feels louder without peaking. Overdo it and the life goes out of the performance."},{id:"rig_20",difficulty:"medium",era:"Theory, Gear & Studio Lore",topic:"theory",question:"Two notes an octave apart share a name \u2014 A and A \u2014 because the higher one vibrates at what rate?",options:["Exactly twice the frequency","Exactly half the frequency","One and a half times","Twelve times"],answer:0,sauce:"The simplest ratio in music, 2:1, and the one every tuning system on earth agrees about. Everyt
